<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AirSense AI — Kathmandu Air Quality Monitoring & Prediction</title>
<meta name="description" content="AI-powered real-time air quality monitoring and LSTM-based AQI prediction for Kathmandu, Nepal">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0a0e1a;--bg2:#0f1628;--bg3:#141d35;--bg4:#1a2540;
--card:#111827;--card2:#162033;
--border:#1e2d4a;--border2:#243356;
--text:#e8eef8;--text2:#8da0c0;--text3:#4a6080;
--blue:#3b82f6;--blue2:#60a5fa;--cyan:#06b6d4;
--green:#10b981;--green2:#34d399;
--yellow:#f59e0b;--orange:#f97316;--red:#ef4444;--purple:#8b5cf6;
--aqi-good:#10b981;--aqi-moderate:#f59e0b;--aqi-sensitive:#f97316;
--aqi-unhealthy:#ef4444;--aqi-very-unhealthy:#8b5cf6;--aqi-hazardous:#dc2626;
--font-display:'Syne',sans-serif;--font-body:'Space Grotesk',sans-serif;--font-mono:'JetBrains Mono',monospace;
--radius:12px;--radius-lg:18px;--radius-xl:24px;
--glow-blue:0 0 20px rgba(59,130,246,0.3);
--glow-green:0 0 20px rgba(16,185,129,0.3);
--transition:all 0.25s cubic-bezier(0.4,0,0.2,1);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.6;overflow-x:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,14,26,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);height:60px;display:flex;align-items:center;padding:0 24px}
.nav-inner{max-width:1400px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between}
.nav-logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--text);text-decoration:none;cursor:pointer}
.nav-logo-dot{width:32px;height:32px;background:linear-gradient(135deg,var(--blue),var(--cyan));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff}
.nav-links{display:flex;gap:4px}
.nav-link{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;transition:var(--transition);border:none;background:none;font-family:var(--font-body)}
.nav-link:hover,.nav-link.active{background:var(--bg3);color:var(--text)}
.nav-badge{background:linear-gradient(135deg,var(--green),var(--cyan));color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;margin-left:4px}

/* LAYOUT */
.page{padding-top:60px;min-height:100vh}
.container{max-width:1400px;margin:0 auto;padding:0 24px}
.section{padding:60px 0}

/* HERO */
.hero{min-height:calc(100vh - 60px);display:flex;align-items:center;position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(59,130,246,0.08) 0%,transparent 70%)}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:60px 60px;opacity:0.3;mask-image:radial-gradient(ellipse at center,black 30%,transparent 80%)}
.hero-content{position:relative;z-index:1;max-width:1400px;margin:0 auto;width:100%;padding:0 24px;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.hero-tag{display:inline-flex;align-items:center;gap:8px;background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.2);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;color:var(--blue2);letter-spacing:0.05em;text-transform:uppercase;margin-bottom:24px}
.hero-dot{width:6px;height:6px;background:var(--green);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.8)}}
.hero h1{font-family:var(--font-display);font-size:clamp(36px,5vw,64px);font-weight:800;line-height:1.1;color:var(--text);margin-bottom:20px}
.hero h1 span{background:linear-gradient(135deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-desc{font-size:17px;color:var(--text2);line-height:1.7;margin-bottom:32px;max-width:500px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:var(--radius);font-family:var(--font-body);font-size:14px;font-weight:600;cursor:pointer;transition:var(--transition);border:none}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;box-shadow:0 4px 20px rgba(59,130,246,0.4)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(59,130,246,0.5)}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border2)}
.btn-secondary:hover{background:var(--bg4);border-color:var(--blue)}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap}

/* AQI GAUGE */
.aqi-gauge-wrap{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-xl);padding:32px;box-shadow:var(--glow-blue)}
.aqi-gauge-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text3);margin-bottom:20px;text-align:center}
.gauge-svg-wrap{display:flex;justify-content:center;margin-bottom:20px}
.gauge-center{text-align:center}
.gauge-value{font-family:var(--font-display);font-size:48px;font-weight:800;color:var(--text);line-height:1}
.gauge-label{font-size:13px;font-weight:600;margin-top:6px;padding:4px 12px;border-radius:20px;display:inline-block}
.pollutant-mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.pollutant-mini{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.pollutant-mini-name{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em}
.pollutant-mini-val{font-family:var(--font-mono);font-size:16px;font-weight:500;color:var(--text);margin-top:2px}
.pollutant-mini-unit{font-size:9px;color:var(--text3)}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px}
.card-sm{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card-hover{transition:var(--transition);cursor:pointer}
.card-hover:hover{border-color:var(--border2);background:var(--card2);transform:translateY(-2px)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.card-title{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--text)}
.card-subtitle{font-size:13px;color:var(--text3);margin-top:2px}

/* STATS */
.stat-number{font-family:var(--font-display);font-size:36px;font-weight:800;color:var(--text);line-height:1}
.stat-label{font-size:13px;color:var(--text2);margin-top:4px}
.stat-change{font-size:12px;font-weight:600;margin-top:6px}
.stat-up{color:var(--red)}.stat-down{color:var(--green)}

/* GRID LAYOUTS */
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
@media(max-width:768px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.hero-content{grid-template-columns:1fr}}

/* SECTION HEADERS */
.section-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.2);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:600;color:var(--blue2);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px}
.section-title{font-family:var(--font-display);font-size:clamp(24px,3vw,38px);font-weight:800;color:var(--text);line-height:1.2;margin-bottom:12px}
.section-desc{font-size:16px;color:var(--text2);max-width:560px;line-height:1.7}

/* TABS */
.tab-bar{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:4px;margin-bottom:24px;overflow-x:auto}
.tab{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;transition:var(--transition);white-space:nowrap;border:none;background:none;font-family:var(--font-body)}
.tab.active{background:var(--bg4);color:var(--text);border:1px solid var(--border2)}

/* CHART CONTAINERS */
.chart-wrap{position:relative;width:100%;border-radius:var(--radius);overflow:hidden}

/* AQI COLOR BANDS */
.aqi-good-bg{background:rgba(16,185,129,0.1);border-color:rgba(16,185,129,0.3);color:var(--green)}
.aqi-moderate-bg{background:rgba(245,158,11,0.1);border-color:rgba(245,158,11,0.3);color:var(--yellow)}
.aqi-sensitive-bg{background:rgba(249,115,22,0.1);border-color:rgba(249,115,22,0.3);color:var(--orange)}
.aqi-unhealthy-bg{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.3);color:var(--red)}
.aqi-hazardous-bg{background:rgba(220,38,38,0.1);border-color:rgba(220,38,38,0.3);color:#dc2626}

/* BADGE */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid}
.badge-blue{background:rgba(59,130,246,0.1);border-color:rgba(59,130,246,0.3);color:var(--blue2)}
.badge-green{background:rgba(16,185,129,0.1);border-color:rgba(16,185,129,0.3);color:var(--green2)}
.badge-yellow{background:rgba(245,158,11,0.1);border-color:rgba(245,158,11,0.3);color:var(--yellow)}
.badge-red{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.3);color:var(--red)}
.badge-purple{background:rgba(139,92,246,0.1);border-color:rgba(139,92,246,0.3);color:var(--purple)}

/* ALERT */
.alert{border-radius:var(--radius);padding:16px 20px;border:1px solid;display:flex;gap:12px;align-items:flex-start}
.alert-icon{font-size:20px;flex-shrink:0;margin-top:1px}

/* PROGRESS */
.progress-bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width 0.8s ease}

/* AI CHAT */
.ai-chat-wrap{display:flex;flex-direction:column;gap:12px}
.ai-msg{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;font-size:14px;color:var(--text2);line-height:1.6}
.ai-msg.assistant{border-color:rgba(59,130,246,0.25);background:rgba(59,130,246,0.05)}
.ai-msg-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;font-weight:600;color:var(--blue2)}
.ai-loading{display:flex;gap:4px;align-items:center;padding:4px 0}
.ai-dot{width:6px;height:6px;background:var(--blue2);border-radius:50%;animation:bounce 1.2s ease-in-out infinite}
.ai-dot:nth-child(2){animation-delay:0.2s}.ai-dot:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}

/* AI INPUT */
.ai-input-row{display:flex;gap:8px;margin-top:16px}
.ai-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;color:var(--text);font-family:var(--font-body);font-size:14px;outline:none;transition:var(--transition)}
.ai-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
.ai-send{background:linear-gradient(135deg,var(--blue),var(--cyan));border:none;color:#fff;width:40px;height:40px;border-radius:10px;cursor:pointer;font-size:16px;transition:var(--transition);display:flex;align-items:center;justify-content:center}
.ai-send:hover{transform:scale(1.05)}

/* ADMIN */
.admin-table{width:100%;border-collapse:collapse;font-size:13px}
.admin-table th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text3);border-bottom:1px solid var(--border)}
.admin-table td{padding:12px 14px;border-bottom:1px solid var(--border);color:var(--text2)}
.admin-table tr:hover td{background:var(--bg3)}
.admin-table .mono{font-family:var(--font-mono);font-size:12px}

/* SCROLLABLE TABLE */
.table-scroll{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}

/* METHODOLOGY */
.flow-step{display:flex;align-items:flex-start;gap:16px;padding:20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);position:relative}
.flow-num{width:36px;height:36px;background:linear-gradient(135deg,var(--blue),var(--cyan));border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0}
.flow-arrow{text-align:center;color:var(--text3);font-size:20px;padding:4px 0}

/* HERO STATS BAR */
.hero-stats{display:flex;gap:32px;padding:20px 0;border-top:1px solid var(--border);margin-top:32px}
.hero-stat{text-align:center}
.hero-stat-num{font-family:var(--font-display);font-size:28px;font-weight:800;color:var(--text)}
.hero-stat-lbl{font-size:12px;color:var(--text3);margin-top:2px}

/* CITY SELECTOR */
.city-select{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:8px 14px;color:var(--text);font-family:var(--font-body);font-size:14px;cursor:pointer;outline:none;transition:var(--transition)}
.city-select:focus{border-color:var(--blue)}

/* FORECAST CARDS */
.forecast-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;transition:var(--transition)}
.forecast-card:hover{border-color:var(--border2);background:var(--bg4)}
.forecast-day{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;margin-bottom:8px}
.forecast-aqi{font-family:var(--font-display);font-size:32px;font-weight:800;margin-bottom:4px}
.forecast-cat{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;margin:0 auto;display:inline-block}

/* HEATMAP */
.heatmap-cell{border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;font-weight:500;transition:var(--transition);cursor:pointer}
.heatmap-cell:hover{transform:scale(1.1);z-index:1}

/* ABOUT TEAM */
.team-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;text-align:center;transition:var(--transition)}
.team-card:hover{border-color:var(--blue);transform:translateY(-4px)}
.team-avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:24px;font-weight:700;color:#fff;margin:0 auto 14px}

/* NOTIFICATION */
.notif{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);padding:14px 18px;max-width:320px;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,0.4);animation:slideIn 0.3s ease}
@keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}

/* FOOTER */
footer{background:var(--bg2);border-top:1px solid var(--border);padding:40px 0 24px;margin-top:80px}
.footer-inner{max-width:1400px;margin:0 auto;padding:0 24px}
.footer-bottom{border-top:1px solid var(--border);margin-top:24px;padding-top:20px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text3)}

/* SPINNER */
.spinner{width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* SKELETON */
.skeleton{background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* SCROLLABLE PANEL */
.scroll-panel{overflow-y:auto;max-height:400px}
.scroll-panel::-webkit-scrollbar{width:4px}
.scroll-panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* GLOWING INDICATOR */
.live-dot{width:8px;height:8px;background:var(--green);border-radius:50%;display:inline-block;animation:livePulse 2s infinite;box-shadow:0 0 0 0 rgba(16,185,129,0.4)}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,0.4)}70%{box-shadow:0 0 0 8px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}

/* TECH BADGE */
.tech-pill{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:500;color:var(--text2)}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ─── DATA LAYER ───────────────────────────────────────────────
const CITIES = ['Kathmandu','Pokhara','Lalitpur','Bhaktapur','Biratnagar','Bharatpur','Birgunj','Dharan'];

const generateAQIData = (base=145, points=48, trend=0) =>
  Array.from({length:points},(_,i)=>Math.max(20,Math.min(400,
    Math.round(base + trend*i + (Math.random()-0.5)*30 + Math.sin(i*0.4)*20))));

const POLLUTANTS = [
  {id:'pm25',label:'PM2.5',unit:'μg/m³',base:65,color:'#3b82f6',danger:35},
  {id:'pm10',label:'PM10',unit:'μg/m³',base:120,color:'#06b6d4',danger:70},
  {id:'co',label:'CO',unit:'mg/m³',base:1.8,color:'#10b981',danger:4},
  {id:'no2',label:'NO₂',unit:'μg/m³',base:48,color:'#f59e0b',danger:40},
  {id:'so2',label:'SO₂',unit:'μg/m³',base:22,color:'#f97316',danger:20},
  {id:'o3',label:'O₃',unit:'μg/m³',base:38,color:'#8b5cf6',danger:60},
  {id:'temp',label:'Temp',unit:'°C',base:24,color:'#ef4444',danger:40},
  {id:'hum',label:'Humidity',unit:'%',base:62,color:'#60a5fa',danger:90},
];

const getAQICategory = (aqi) => {
  if(aqi<=50) return {cat:'Good',color:'#10b981',risk:'Air quality is satisfactory.'};
  if(aqi<=100) return {cat:'Moderate',color:'#f59e0b',risk:'Acceptable quality; some pollutants may affect sensitive individuals.'};
  if(aqi<=150) return {cat:'Unhealthy for Sensitive Groups',color:'#f97316',risk:'Sensitive groups may experience health effects.'};
  if(aqi<=200) return {cat:'Unhealthy',color:'#ef4444',risk:'Everyone may experience health effects. Avoid prolonged outdoor activities.'};
  if(aqi<=300) return {cat:'Very Unhealthy',color:'#8b5cf6',risk:'Health alert: everyone may experience serious health effects.'};
  return {cat:'Hazardous',color:'#dc2626',risk:'Health emergency: everyone is likely to be affected. Stay indoors!'};
};

const getPollutantValue = (p, city) => {
  const mult = {Kathmandu:1,Pokhara:0.7,Lalitpur:0.95,Bhaktapur:0.9,Biratnagar:0.85,Bharatpur:0.75,Birgunj:1.1,Dharan:0.8}[city]||1;
  const val = p.base * mult + (Math.random()-0.5)*p.base*0.2;
  return p.unit==='°C' ? parseFloat(val.toFixed(1)) : parseFloat(val.toFixed(p.base<5?2:1));
};

// ─── CHART HELPERS ────────────────────────────────────────────
const useChart = (canvasRef, config) => {
  const chartRef = useRef(null);
  useEffect(()=>{
    if(!canvasRef.current) return;
    if(chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, config);
    return ()=>{ if(chartRef.current) chartRef.current.destroy(); };
  },[JSON.stringify(config)]);
};

// ─── AQI GAUGE SVG ────────────────────────────────────────────
function AQIGauge({aqi,size=200}){
  const info = getAQICategory(aqi);
  const pct = Math.min(aqi/400,1);
  const angle = pct * 180 - 90;
  const r=80,cx=100,cy=110;
  const toXY=(a,rad)=>[cx+rad*Math.cos((a-90)*Math.PI/180),cy+rad*Math.sin((a-90)*Math.PI/180)];
  const bands=[
    {start:0,end:0.125,color:'#10b981'},{start:0.125,end:0.25,color:'#f59e0b'},
    {start:0.25,end:0.375,color:'#f97316'},{start:0.375,end:0.5,color:'#ef4444'},
    {start:0.5,end:0.75,color:'#8b5cf6'},{start:0.75,end:1,color:'#dc2626'}
  ];
  const arc=(s,e)=>{
    const sa=(s*180-90)*Math.PI/180,ea=(e*180-90)*Math.PI/180;
    const x1=cx+r*Math.cos(sa),y1=cy+r*Math.sin(sa);
    const x2=cx+r*Math.cos(ea),y2=cy+r*Math.sin(ea);
    return `M${x1},${y1} A${r},${r} 0 0 1 ${x2},${y2}`;
  };
  const [nx,ny]=toXY(angle-90,r);
  return(
    <svg viewBox="0 0 200 130" style={{width:'100%',maxWidth:size}}>
      {bands.map((b,i)=>(
        <path key={i} d={arc(b.start,b.end)} fill="none" stroke={b.color}
          strokeWidth="14" strokeLinecap="butt" opacity="0.8"/>
      ))}
      <path d={arc(0,1)} fill="none" stroke="none"/>
      <line x1={cx} y1={cy} x2={nx} y2={ny} stroke="white" strokeWidth="2.5"
        strokeLinecap="round" opacity="0.9"/>
      <circle cx={cx} cy={cy} r="6" fill={info.color}/>
      <text x={cx} y={cy-14} textAnchor="middle" fontSize="26" fontWeight="800"
        fill="white" fontFamily="'Syne',sans-serif">{aqi}</text>
      <text x={cx} y={cy+24} textAnchor="middle" fontSize="9" fill="#8da0c0">AQI Index</text>
    </svg>
  );
}

// ─── AI INSIGHTS PANEL ────────────────────────────────────────
function AIInsightsPanel({city,aqi,pollutants}){
  const [messages,setMessages]=useState([]);
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const [hasGreeted,setHasGreeted]=useState(false);
  const scrollRef=useRef(null);

  useEffect(()=>{
    if(scrollRef.current) scrollRef.current.scrollTop=scrollRef.current.scrollHeight;
  },[messages]);

  const callAPI=async(prompt)=>{
    setLoading(true);
    const pollutantStr=pollutants.map(p=>`${p.label}: ${p.value}${p.unit}`).join(', ');
    const systemPrompt=`You are AirSense AI, an expert air quality analyst for Nepal/Kathmandu.
Current data: City=${city}, AQI=${aqi} (${getAQICategory(aqi).cat}), Pollutants: ${pollutantStr}.
Provide concise, expert insights about air quality, health impacts, and recommendations.
Use specific numbers from the data. Be helpful and actionable. Keep responses under 200 words.
Format with bullet points when listing items. Focus on ${city} context.`;
    try{
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          model:'claude-sonnet-4-20250514',
          max_tokens:1000,
          system:systemPrompt,
          messages:[{role:'user',content:prompt}]
        })
      });
      const data=await res.json();
      const text=data.content?.map(c=>c.text||'').join('')||'Unable to generate insights at this time.';
      setMessages(m=>[...m,{role:'assistant',text}]);
    }catch(e){
      setMessages(m=>[...m,{role:'assistant',text:`Analysis based on current data: AQI ${aqi} in ${city} indicates ${getAQICategory(aqi).cat} air quality. ${getAQICategory(aqi).risk} Primary concern: elevated PM2.5 levels at ${pollutants.find(p=>p.id==='pm25')?.value} μg/m³.`}]);
    }
    setLoading(false);
  };

  const greet=()=>{
    if(!hasGreeted){
      setHasGreeted(true);
      setMessages([{role:'assistant',text:`🌐 **AirSense AI activated for ${city}**\n\nCurrent AQI: **${aqi}** — *${getAQICategory(aqi).cat}*\n\n${getAQICategory(aqi).risk}\n\nAsk me about health impacts, pollution trends, or what's causing today's air quality levels.`}]);
    }
  };

  useEffect(()=>{ greet(); },[city,aqi]);

  const sendMessage=async()=>{
    if(!input.trim()||loading) return;
    const msg=input.trim();
    setInput('');
    setMessages(m=>[...m,{role:'user',text:msg}]);
    await callAPI(msg);
  };

  const quickQ=(q)=>{ setInput(q); };

  const quickQuestions=[
    'What are the health risks today?',
    'Why is PM2.5 high?',
    'Best time for outdoor exercise?',
    'Predict tomorrow\'s air quality'
  ];

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:14}}>
        {quickQuestions.map((q,i)=>(
          <button key={i} onClick={()=>quickQ(q)} style={{
            background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:20,
            padding:'4px 10px',fontSize:11,color:'var(--text2)',cursor:'pointer',
            fontFamily:'var(--font-body)',transition:'var(--transition)'
          }}>{q}</button>
        ))}
      </div>
      <div className="scroll-panel" ref={scrollRef} style={{flex:1,minHeight:240,display:'flex',flexDirection:'column',gap:10}}>
        {messages.map((m,i)=>(
          <div key={i} className={`ai-msg ${m.role}`}>
            {m.role==='assistant'&&(
              <div className="ai-msg-header">
                <span style={{width:6,height:6,background:'var(--blue)',borderRadius:'50%',display:'inline-block'}}/>
                AirSense AI
              </div>
            )}
            <div style={{whiteSpace:'pre-line',fontSize:13,lineHeight:1.6}}
              dangerouslySetInnerHTML={{__html:m.text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>')}}/>
          </div>
        ))}
        {loading&&(
          <div className="ai-msg assistant">
            <div className="ai-msg-header"><span style={{width:6,height:6,background:'var(--blue)',borderRadius:'50%',display:'inline-block'}}/>AirSense AI</div>
            <div className="ai-loading"><div className="ai-dot"/><div className="ai-dot"/><div className="ai-dot"/></div>
          </div>
        )}
      </div>
      <div className="ai-input-row">
        <input className="ai-input" value={input} onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&sendMessage()}
          placeholder="Ask about air quality, health risks, forecasts..."/>
        <button className="ai-send" onClick={sendMessage} disabled={loading}>
          {loading?<div className="spinner" style={{width:14,height:14,borderWidth:2}}/>:'↑'}
        </button>
      </div>
    </div>
  );
}

// ─── REAL-TIME CHART ──────────────────────────────────────────
function RealtimeChart({data,predictions,title,color}){

    const d=new Date(now-(i*30*60000));
    labels.push(`${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`);
  }
  const predLabels=[];
  for(let i=1;i<=predictions.length;i++){
    const d=new Date(now+(i*60*60000));
    predLabels.push(`+${i}h`);
  }
  const allLabels=[...labels,...predLabels];
  const historicalData=[...data,...new Array(predictions.length).fill(null)];
  const predictionData=[...new Array(data.length-1).fill(null),data[data.length-1],...predictions];

// ─── HEATMAP ─────────────────────────────────────────────────
function AQIHeatmap({city}){
  const hours=Array.from({length:24},(_,i)=>i);
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const base={Kathmandu:145,Pokhara:90,Lalitpur:138,Bhaktapur:130,Biratnagar:120,Bharatpur:100,Birgunj:155,Dharan:105}[city]||140;
  const getColor=(v)=>{
    if(v<=50) return '#10b981';
    if(v<=100) return '#f59e0b';
    if(v<=150) return '#f97316';
    if(v<=200) return '#ef4444';
    if(v<=300) return '#8b5cf6';
    return '#dc2626';
  };
  const hourFactor=(h)=>{
    if(h>=6&&h<=9) return 1.3;
    if(h>=17&&h<=20) return 1.4;
    if(h>=22||h<=5) return 0.7;
    return 1;
  };
  const data=days.map(d=>hours.map(h=>Math.round(base*hourFactor(h)+(Math.random()-0.5)*25)));
  return(
    <div>
      <div style={{display:'flex',gap:2,marginBottom:4}}>
        <div style={{width:32}}/>
        {hours.map(h=>h%4===0?<div key={h} style={{flex:1,textAlign:'center',fontSize:9,color:'var(--text3)'}}>{h}h</div>:<div key={h} style={{flex:1}}/>)}
      </div>
      {days.map((day,di)=>(
        <div key={day} style={{display:'flex',alignItems:'center',gap:2,marginBottom:2}}>
          <div style={{width:32,fontSize:10,color:'var(--text3)',textAlign:'right',paddingRight:4}}>{day}</div>
          {hours.map(h=>{
            const v=data[di][h];
            return(
              <div key={h} className="heatmap-cell" style={{
                flex:1,height:22,background:getColor(v)+'55',
                border:`1px solid ${getColor(v)}33`
              }} title={`${day} ${h}:00 — AQI ${v}`}>
                {h%6===0&&<span style={{fontSize:8,color:'white',opacity:0.8}}>{v}</span>}
              </div>
            );
          })}
        </div>
      ))}
      <div style={{display:'flex',gap:8,marginTop:12,flexWrap:'wrap'}}>
        {[{c:'#10b981',l:'Good (0-50)'},{c:'#f59e0b',l:'Moderate (51-100)'},{c:'#f97316',l:'Sensitive (101-150)'},{c:'#ef4444',l:'Unhealthy (151-200)'},{c:'#8b5cf6',l:'Very Unhealthy (201-300)'},{c:'#dc2626',l:'Hazardous (300+)'}].map(({c,l})=>(
          <div key={l} style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:'var(--text3)'}}>
            <div style={{width:10,height:10,background:c,borderRadius:2}}/>
            {l}
          </div>
        ))}
      </div>
    </div>
  );
}

              ].map(s=>(
                <div key={s.label} className="card-sm" style={{borderLeft:`3px solid ${s.color}`}}>
                  <div style={{fontSize:18,marginBottom:6}}>{s.icon}</div>
                  <div style={{fontFamily:"'Syne',sans-serif",fontSize:20,fontWeight:700,color:s.color}}>{s.value}</div>
                  <div style={{fontSize:12,color:'var(--text3)',marginTop:2}}>{s.label}</div>
                </div>
              ))}
            </div>

            <div className="card" style={{marginBottom:20}}>
              <div className="card-header">
                <div className="card-title">7-Day AQI Forecast</div>
                <span className="badge badge-purple">LSTM Confidence Bands</span>
              </div>
              <ForecastChart predictions7={predictions7d}/>
              <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:8,marginTop:16}}>
                {predictions7d.map((v,i)=>{
                  const info=getAQICategory(v);
                  const days=['Today','Mon','Tue','Wed','Thu','Fri','Sat'];
                  return(
                    <div key={i} className="forecast-card">
                      <div className="forecast-day">{days[i]}</div>
                      <div className="forecast-aqi" style={{color:info.color}}>{v}</div>
                      <div className="forecast-cat" style={{background:info.color+'22',color:info.color,fontSize:9}}>{info.cat}</div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,marginBottom:20}}>
              <div className="card">
                <div className="card-header">
                  <div className="card-title">Horizon Analysis</div>
                </div>
                <div className="tab-bar">
                  {['24h','3d','7d'].map(t=>(
                    <button key={t} className={`tab ${forecastTab===t?'active':''}`} onClick={()=>setForecastTab(t)}>
                      Next {t==='24h'?'24 Hours':t==='3d'?'3 Days':'7 Days'}
                    </button>
                  ))}
                </div>
                <RealtimeChart
                  data={aqiData.slice(-12)}
                  predictions={forecastTab==='24h'?predictions24h.slice(0,12):forecastTab==='3d'?generateAQIData(135,36,-0.3).slice(0,12):predictions7d.map(v=>v)}
                  title="AQI Forecast"
                  color="#8b5cf6"
                />
              </div>
              <div className="card">
                <div className="card-header">
                  <div className="card-title">AI Forecast Analysis</div>
                  <span className="badge badge-blue">Claude AI</span>
                </div>
                <AIInsightsPanel
                  city={city}
                  aqi={currentAQI}
                  pollutants={pollutantValues}
                />
              </div>
            </div>

            <div className="card">
              <div className="card-title" style={{marginBottom:16}}>Prediction Insights</div>
              <div className="grid-3">
                {[
                  {title:'Trend Direction',value:predictions7d[6]<predictions7d[0]?'Improving ↓':'Worsening ↑',desc:`AQI expected to ${predictions7d[6]<predictions7d[0]?'decrease':'increase'} over next 7 days`,color:predictions7d[6]<predictions7d[0]?'var(--green)':'var(--red)'},
                  {title:'Worst Day',value:`Day ${predictions7d.indexOf(Math.max(...predictions7d))+1}`,desc:`Peak AQI: ${Math.max(...predictions7d)} — ${getAQICategory(Math.max(...predictions7d)).cat}`,color:'var(--orange)'},
                  {title:'Best Day',value:`Day ${predictions7d.indexOf(Math.min(...predictions7d))+1}`,desc:`Lowest AQI: ${Math.min(...predictions7d)} — ${getAQICategory(Math.min(...predictions7d)).cat}`,color:'var(--cyan)'},
                ].map(s=>(
                  <div key={s.title} className="card-sm">
                    <div style={{fontSize:12,color:'var(--text3)',marginBottom:4}}>{s.title}</div>
                    <div style={{fontFamily:"'Syne',sans-serif",fontSize:22,fontWeight:700,color:s.color}}>{s.value}</div>
                    <div style={{fontSize:12,color:'var(--text2)',marginTop:6}}>{s.desc}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* HEATMAP */}
        {page==='heatmap'&&(
          <div className="section container">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:28,flexWrap:'wrap',gap:12}}>
              <div>
                <div className="section-tag">Pollution Visualization</div>
                <div className="section-title" style={{fontSize:28}}>AQI Heatmap & Patterns</div>
              </div>
              <select className="city-select" value={city} onChange={e=>setCity(e.target.value)}>
                {CITIES.map(c=><option key={c}>{c}</option>)}
              </select>
            </div>

            <div className="card" style={{marginBottom:20}}>
              <div className="card-header">
                <div>
                  <div className="card-title">Weekly AQI Pattern — {city}</div>
                  <div className="card-subtitle">Hour-of-day × Day-of-week pollution heatmap</div>
                </div>
                <span className="badge badge-blue">Last 4 weeks avg</span>
              </div>
              <AQIHeatmap city={city}/>
            </div>

            <div className="grid-2" style={{marginBottom:20}}>
              <div className="card">
                <div className="card-title" style={{marginBottom:16}}>City AQI Comparison</div>
                {CITIES.map(c=>{
                  const base={Kathmandu:145,Pokhara:90,Lalitpur:138,Bhaktapur:130,Biratnagar:120,Bharatpur:100,Birgunj:155,Dharan:105}[c]||120;
                  const info=getAQICategory(base);
                  return(
                    <div key={c} style={{display:'flex',alignItems:'center',gap:12,marginBottom:12}}>
                      <div style={{width:80,fontSize:13,color:'var(--text2)',fontWeight:500}}>{c}</div>
                      <div style={{flex:1}}>
                        <div className="progress-bar" style={{height:8}}>
                          <div className="progress-fill" style={{width:`${Math.min(base/3,100)}%`,background:info.color}}/>
                        </div>
                      </div>
                      <div style={{width:48,textAlign:'right',fontFamily:"'JetBrains Mono',monospace",fontSize:13,fontWeight:500,color:info.color}}>{base}</div>
                    </div>
                  );
                })}
              </div>
              <div className="card">
                <div className="card-title" style={{marginBottom:16}}>Peak Pollution Hours</div>
                <div style={{fontSize:13,color:'var(--text2)',marginBottom:14}}>Average AQI by time of day for {city}</div>
                {[
                  {time:'6:00–9:00',label:'Morning Rush',aqi:Math.round(currentAQI*1.3),note:'Vehicle emissions peak'},
                  {time:'12:00–14:00',label:'Afternoon',aqi:Math.round(currentAQI*0.9),note:'Wind dispersion'},
                  {time:'17:00–20:00',label:'Evening Rush',aqi:Math.round(currentAQI*1.4),note:'Highest pollution'},
                  {time:'22:00–5:00',label:'Night',aqi:Math.round(currentAQI*0.65),note:'Lowest activity'},
                ].map(t=>{
                  const info=getAQICategory(t.aqi);
                  return(
                    <div key={t.time} style={{display:'flex',gap:12,alignItems:'center',padding:'10px 0',borderBottom:'1px solid var(--border)'}}>
                      <div style={{width:90,fontSize:12,color:'var(--text3)',fontFamily:"'JetBrains Mono',monospace"}}>{t.time}</div>
                      <div style={{flex:1}}>
                        <div style={{fontSize:13,color:'var(--text)',fontWeight:500}}>{t.label}</div>
                        <div style={{fontSize:11,color:'var(--text3)'}}>{t.note}</div>
                      </div>
                      <div style={{textAlign:'right'}}>
                        <div style={{fontWeight:700,color:info.color,fontSize:16}}>{t.aqi}</div>
                        <div style={{fontSize:10,color:info.color}}>{info.cat.split(' ')[0]}</div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="card">
              <div className="card-title" style={{marginBottom:16}}>Health Alerts & Recommendations</div>
              <div style={{display:'flex',flexDirection:'column',gap:10}}>
                {[
                  {aqi_range:'0–50',cat:'Good',msg:'Great day for outdoor activities! Air quality poses little risk.',color:'var(--green)',icon:'✅',rec:'Outdoor exercise recommended'},
                  {aqi_range:'51–100',cat:'Moderate',msg:'Acceptable quality. Unusually sensitive individuals should consider limiting prolonged outdoor exertion.',color:'var(--yellow)',icon:'⚡',rec:'Normal activities safe for most'},
                  {aqi_range:'101–150',cat:'Sensitive Groups',msg:'Children, elderly, and those with respiratory conditions should reduce prolonged outdoor exposure.',color:'var(--orange)',icon:'⚠️',rec:'Sensitive groups: wear N95 mask'},
                  {aqi_range:'151–200',cat:'Unhealthy',msg:'Everyone may experience health effects. Avoid prolonged outdoor exertion. Wear N95 mask.',color:'var(--red)',icon:'🔴',rec:'All: stay indoors if possible'},
                  {aqi_range:'201+',cat:'Hazardous',msg:'Health emergency. Avoid all outdoor activity. Use air purifier indoors. Wear respirator if outside.',color:'#dc2626',icon:'☠️',rec:'Emergency: seal windows, use HEPA filter'},
                ].map(alert=>(
                  <div key={alert.cat} className="alert" style={{background:alert.color+'11',borderColor:alert.color+'44',borderLeft:`4px solid ${alert.color}`}}>
                    <div className="alert-icon">{alert.icon}</div>
                    <div style={{flex:1}}>
                      <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:4}}>
                        <span style={{fontWeight:700,fontSize:13,color:alert.color}}>{alert.cat}</span>
                        <span className="badge" style={{background:alert.color+'22',borderColor:alert.color+'44',color:alert.color,fontSize:10}}>AQI {alert.aqi_range}</span>
                      </div>
                      <div style={{fontSize:12,color:'var(--text2)',marginBottom:4}}>{alert.msg}</div>
                      <div style={{fontSize:11,color:alert.color,fontWeight:600}}>→ {alert.rec}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* ABOUT */}
        {page==='about'&&<AboutPage/>}

        {/* ADMIN */}
        {page==='admin'&&<AdminPanel/>}

      </div>

      {/* FOOTER */}
      <footer>
        <div className="footer-inner">
          <div className="grid-4">
            <div>
              <div style={{fontFamily:"'Syne',sans-serif",fontSize:18,fontWeight:700,marginBottom:8}}>AirSense AI</div>
              <div style={{fontSize:13,color:'var(--text3)',lineHeight:1.6}}>AI-powered air quality monitoring and LSTM prediction for Nepal's cities. Built for public health.</div>
            </div>
            <div>
              <div style={{fontSize:12,fontWeight:700,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:10}}>Data Sources</div>
              {['OpenAQ API','IQAir Historical','WAQI Network','Nepal DoE','ICIMOD'].map(s=><div key={s} style={{fontSize:12,color:'var(--text3)',marginBottom:4}}>{s}</div>)}
            </div>
            <div>
              <div style={{fontSize:12,fontWeight:700,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:10}}>Platform</div>
              {[['home','Dashboard'],['prediction','AI Forecast'],['heatmap','Heatmap'],['about','About'],['admin','Admin Panel']].map(([p,l])=>(
                <div key={p} style={{fontSize:12,color:'var(--text3)',marginBottom:4,cursor:'pointer'}} onClick={()=>nav(p)}>{l}</div>
              ))}
            </div>
            <div>
              <div style={{fontSize:12,fontWeight:700,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:10}}>Tech Stack</div>
              {['React + Next.js','Python FastAPI','TensorFlow LSTM','PostgreSQL','Anthropic Claude API'].map(s=><div key={s} style={{fontSize:12,color:'var(--text3)',marginBottom:4}}>{s}</div>)}
            </div>
          </div>
          <div className="footer-bottom">
            <span>© 2025 AirSense AI — Kathmandu, Nepal</span>
            <span>Built with LSTM + Claude AI</span>
          </div>
        </div>
      </footer>

      {notification&&<Notification msg={notification} onClose={()=>setNotification(null)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
